name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  minify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          npm install -g html-minifier-terser clean-css-cli terser postcss-cli autoprefixer
          npm install

      - name: Minify and optimize assets
        run: |
          set -e  # Stop on any error
          mkdir -p dist/script dist/style
          
          echo "Minifying HTML..."
          html-minifier-terser \
          --collapse-whitespace \
          --remove-comments \
          --remove-optional-tags \
          --remove-redundant-attributes \
          --remove-script-type-attributes \
          --remove-tag-whitespace \
          --use-short-doctype \
          --minify-css true \
          --minify-js true \
          -o dist/index.html \
          index.html
          
          echo "Processing and minifying CSS..."
          for cssfile in main noscript; do
            postcss "style/${cssfile}.css" \
            --use autoprefixer \
            --no-map \
            -o "temp-${cssfile}.css"
          
            cleancss \
            -o "dist/style/${cssfile}.css" \
            "temp-${cssfile}.css"
          done
          
          echo "Minifying JavaScript..."
          for jsfile in main; do
            terser "script/${jsfile}.js" \
            --compress \
            --mangle \
            --comments false \
            -o "dist/script/${jsfile}.js"
          done
          
          echo "Copying assets..."
          cp -r assets dist/ || true
          [ -f favicon.ico ] && cp favicon.ico dist/
          
          echo "Cleaning up temporary files..."
          rm -f temp-*.css
          
          echo "✅ Assets successfully optimized."

      - name: Upload dist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  lighthouse:
    runs-on: ubuntu-latest
    needs: minify
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install -g @lhci/cli

      - name: Download optimized site
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Start static server
        run: |
          npx serve -s ./dist -l 8080 &
          sleep 5

      - name: Run Lighthouse CI
        run: lhci autorun

  deploy:
    name: Build & Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: lighthouse
    if: ${{ success() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Download optimized site
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
